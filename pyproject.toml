[project]
name = "network-automation-interview-lab"
version = "0.1.0"
description = ""
authors = [
    {name = "Paolo Solari",email = "paolosolari1998@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "nornir (>=3.6.0,<4.0.0)",
    "nornir-napalm (>=0.6.0,<0.7.0)",
    "pyats (>=26.7,<27.0)",
    "genie (>=26.7,<27.0)",
    "ncclient (>=0.7.1,<0.8.0)"
]

[tool.poetry]
packages = [
    { include = "network_automation_lab", from = "src" }
]

[tool.mypy]
ignore_missing_imports = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.16.2"
mypy = "^2.3.0"
types-pyyaml = "^6.0.12.20260724"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
